name: Docker

on:
  repository_dispatch:
    types: rebuild-image

  schedule:
    - cron: '0 0 * * SUN'
      
  push:
    # Publish `main` as Docker `latest` image.
    branches:
      - main

    # Publish `v1.2.3` tags as releases.
    tags:
      - v*

  # Run tests for any PRs.
  pull_request:

env:
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read
  packages: write

jobs:
  # Run tests.
  # See also https://docs.docker.com/docker-hub/builds/automated-testing/
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run tests
        run: |
          export DOCKER_BUILDKIT=1
          if [ -f docker-compose.test.yml ]; then
            docker-compose --file docker-compose.test.yml build
            docker-compose --file docker-compose.test.yml run sut
          else
            docker build . --file Dockerfile
          fi

  # Push image to GitHub Packages.
  # See also https://docs.docker.com/docker-hub/builds/
  push:
    # Ensure test job passes before pushing image.
    needs: test

    strategy:
      matrix:
        tag: [latest, resolute, noble, jammy, focal]

    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'repository_dispatch'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ github.repository_owner }}
          password: ${{ secrets.DOCKER_HUB }}

      - name: Build and push to Docker Hub
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ github.repository_owner }}/oem-scripts-docker:${{ matrix.tag }}
          build-args: |
            TAG=${{ matrix.tag }}

      # Note: GHCR push is disabled until CR_PAT secret is updated with a fresh
      # Personal Access Token. The previous CR_PAT (created 2021-10-12) is expired.
      # To enable GHCR push:
      # 1. Create a new PAT at https://github.com/settings/tokens with scopes: repo, write:packages
      # 2. Update CR_PAT secret at: https://github.com/fourdollars/oem-scripts-docker/settings/secrets/actions
      # 3. Uncomment the steps below
      #
      # - name: Log in to GitHub Container Registry
      #   uses: docker/login-action@v3
      #   with:
      #     registry: ghcr.io
      #     username: ${{ github.repository_owner }}
      #     password: ${{ secrets.CR_PAT }}
      #
      # - name: Build and push to GitHub Container Registry
      #   uses: docker/build-push-action@v6
      #   with:
      #     context: .
      #     push: true
      #     tags: |
      #       ghcr.io/${{ github.repository_owner }}/oem-scripts-docker:${{ matrix.tag }}
      #     build-args: |
      #       TAG=${{ matrix.tag }}
